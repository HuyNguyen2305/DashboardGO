# Run with: go tool task <name>   (list everything: go tool task)
# Task runs commands with its built-in POSIX shell, so these work the same on Windows, macOS and Linux.
version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: List available tasks
    cmds:
      - go tool task --list
    silent: true

  run:
    desc: Run the API server (reads .env)
    cmds:
      - go run ./cmd/api

  build:
    desc: Build the API binary into bin/
    cmds:
      - go build -o bin/api{{exeExt}} ./cmd/api

  generate:
    desc: Regenerate sqlc queries and mockery mocks
    cmds:
      - sqlc generate
      - go tool mockery

  fmt:
    desc: Format all Go code
    cmds:
      - gofmt -w .

  lint:
    desc: Run golangci-lint on everything
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./tests/unit/...

  test:integration:
    desc: Run integration tests against the server in TEST_POSTGRES_URL
    cmds:
      - go test -tags=integration ./tests/integration/...

  test:all:
    desc: Run unit and integration tests
    cmds:
      - task: test
      - task: test:integration

  check:
    desc: Formatting check, lint and unit tests (run before committing)
    cmds:
      - cmd: test -z "$(gofmt -l .)" || (echo "Unformatted files:"; gofmt -l .; exit 1)
        silent: true
      - task: lint
      - task: test

  migrate:up:
    desc: Apply pending migrations to DATABASE_URL
    cmds:
      - go run ./cmd/migrate up

  migrate:down:
    desc: Revert migrations (default 1; e.g. go tool task migrate:down -- 2)
    cmds:
      - go run ./cmd/migrate down {{.CLI_ARGS}}

  migrate:version:
    desc: Show the current migration version
    cmds:
      - go run ./cmd/migrate version

  seed:
    desc: Seed DATABASE_URL (e.g. go tool task seed -- --preset=demo --reset)
    cmds:
      - go run ./cmd/seed {{.CLI_ARGS}}
